spring:
  application:
    name: secure-spring-app
  
  datasource:
    url: ${DB_URL:jdbc:mysql://database:3306/secureapp?useSSL=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  
  cache:
    type: redis
    redis:
      time-to-live: 600000

  # Vault Configuration (for production)
  cloud:
    vault:
      enabled: true
      host: ${VAULT_HOST:vault}
      port: ${VAULT_PORT:8200}
      scheme: ${VAULT_SCHEME:https}
      authentication: KUBERNETES
      kubernetes:
        role: ${VAULT_ROLE:secure-spring-app}
        service-account-token-file: /var/run/secrets/kubernetes.io/serviceaccount/token

server:
  port: 8080
  compression:
    enabled: true
  http2:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: WARN
    com.security.app: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/secure-spring-app/application.log
    max-size: 10MB
    max-history: 30
