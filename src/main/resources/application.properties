# Application Configuration
spring.application.name=secure-spring-app

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=on_param

# Database Configuration (AWS RDS MySQL)
spring.datasource.url=jdbc:mysql://database-1.czuqqsmc6646.eu-central-1.rds.amazonaws.com:3306/secureappdb?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console (disabled for production)
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Redis Configuration (for caching) - Disabled by default
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
spring.cache.type=simple
# spring.cache.redis.time-to-live=600000

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.health.redis.enabled=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.security.app=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Vault Configuration (disabled by default for standalone running)
spring.cloud.vault.enabled=false
