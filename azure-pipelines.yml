trigger:
  branches:
    include:
      - main

stages:
  - stage: WindowsStage
    displayName: 'Windows Stage'
    jobs:
      - job: WindowsJob
        pool:
          name: 'Default'
          demands:
            - Agent.Name -equals windows
        steps:
          - script: |
              echo "Running on agent: %AGENT_NAME%"
              # your windows-specific command here
            displayName: 'Run Windows-specific command'

  - stage: MacStage
    displayName: 'macOS Stage'
    dependsOn: WindowsStage
    jobs:
      - job: MacJob
        pool:
          name: 'Default'
          demands:
            - Agent.Name -equals macos
        steps:
          - script: |
              echo "Running on agent: $AGENT_NAME"
              # your mac-specific command here
            displayName: 'Run macOS-specific command'